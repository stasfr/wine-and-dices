services:
  wad-db-postgres:
    image: postgres:18.3
    container_name: wad-db-postgres
    environment:
      - POSTGRES_USER=${NUXT_DB_USER}
      - POSTGRES_PASSWORD=${NUXT_DB_PASSWORD}
      - POSTGRES_DB=${NUXT_DB_NAME}
    ports:
      - '${NUXT_DB_PORT}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${NUXT_DB_USER} -d ${NUXT_DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  default:
    name: wad-network
